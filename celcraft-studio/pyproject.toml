[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "celcraft-studio"
version = "1.0.0"
description = "Frame-by-frame 2D cel animation studio for AI agents: headless-Chromium brush renderer, onion skinning, lip-sync, FFmpeg mastering, CLI + MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["animation", "2d", "cel", "anime", "mcp", "agent", "playwright", "ffmpeg", "lip-sync", "onion-skin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10.1",
  "playwright>=1.44",
  "imageio-ffmpeg>=0.5",
  "mcp>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
celcraft = "celcraft.cli:main"
celcraft-mcp = "celcraft.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["celcraft"]

[tool.hatch.build.targets.wheel.force-include]
"renderer" = "celcraft/_data/renderer"
"presets" = "celcraft/_data/presets"
"examples" = "celcraft/_data/examples"
"SKILL.md" = "celcraft/_data/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["celcraft", "renderer", "presets", "examples", "tests", "SKILL.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "renderer: needs headless Chromium (playwright install chromium)",
  "ffmpeg: needs an ffmpeg binary",
]
